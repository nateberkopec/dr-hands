#!/usr/sbin/nft -f
table inet drhands
delete table inet drhands
table inet drhands {
	chain output {
		type filter hook output priority filter; policy accept;
		meta skuid != "agent" accept
		oifname "lo" accept
		ip daddr 100.100.100.100 tcp dport 3460 accept
		limit rate 10/second log prefix "drhands-deny "
		meta l4proto tcp reject with tcp reset
		reject with icmpx admin-prohibited
	}
}
