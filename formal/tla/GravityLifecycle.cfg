SPECIFICATION Spec

CONSTANTS
  Runs = {run1}
  Resources = {resource}
  Authorities = {authority}
  Lease = 2
  MaxTime = 4
  MaxGeneration = 1
  AllowCrash = FALSE
  AllowReject = FALSE
  NoRun = noRun

INVARIANTS
  TypeOK
  ActiveImpliesComplete
  IncompleteNeverActive
  NoStaleAttachment
  ExpiredAuthorityUnusable
  RevokedBeforeDeletion
  RemovedImpliesNothingRemote
  RemovalRequiresObservation
  GenerationBounded
  NoAuthorityAfterRemoval
