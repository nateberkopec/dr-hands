  EvidenceIsRunScoped

PROPERTIES
  RemovalRequestedLeadsToRemoved
  ExpiredLeadsToRevoked
  FailedLeadsToRemoved
  DeleteRequestedLeadsAbsent
  RevocationMonotonic
  EvidenceMonotonic
  DeadlineStable

CHECK_DEADLOCK FALSE
