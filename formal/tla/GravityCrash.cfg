SPECIFICATION Spec

CONSTANTS
  Runs = {run1}
  Resources = {resource}
  Authorities = {authority}
  Lease = 2
  MaxTime = 3
  MaxGeneration = 1
  AllowCrash = TRUE
  AllowReject = TRUE
  NoRun = noRun

INVARIANTS
  TypeOK
  ActiveImpliesComplete
  IncompleteNeverActive
  NoStaleAttachment
  ExpiredAuthorityUnusable
  RevokedBeforeDeletion
  RemovedImpliesNothingRemote
  RemovalRequiresObservation
  GenerationBounded
  NoAuthorityAfterRemoval
  FailedProvisioningNotUsable
  EvidenceIsRunScoped

PROPERTIES
  RevocationMonotonic
  EvidenceMonotonic
  DeadlineStable

CHECK_DEADLOCK FALSE
