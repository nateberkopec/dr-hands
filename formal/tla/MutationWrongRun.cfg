SPECIFICATION MutantSpec

CONSTANTS
  Runs = {run1, run2}
  Resources = {resource}
  Authorities = {authority}
  Lease = 2
  MaxTime = 3
  MaxGeneration = 1
  AllowCrash = FALSE
  AllowReject = FALSE
  NoRun = noRun
  MutationKind = "wrong-run-delete"

INVARIANTS
  TypeOK

PROPERTIES
  RunIsolation

CHECK_DEADLOCK FALSE
