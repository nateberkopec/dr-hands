# Engine: Dagu, using standalone local CLI execution, not a service or scheduler.
# Native syntax validated with Dagu 2.25.2.
# https://docs.dagu.sh/getting-started/cli
# https://docs.dagu.sh/writing-workflows/durable-execution
# Fabro inspired the graph/gate model, but its server-backed execution path does
# not meet the standalone-runner requirement. The graph is bundled tool code,
# not user configuration. Users supply images/data, never graph steps or scripts.
# This is an engine-native specification, not wired to dr-hands execution.
# Command targets are help stubs that exit 3 without performing lifecycle work.
# No report, credential, guest output, or user expression is interpolated here.
# Durable local state contains only bounded control-plane metadata and inventory
# identities, not credentials or report contents. Every mutation reconciles its
# Run ID/generation/deadline before replay. Dagu retry is not exactly-once execution.
# The wrapper must reject attempts to bypass approval, policy, or expiry by using
# engine-only flags, edited graphs, step selection, or automatic whole-run retry.
# UI, scheduler, queues, remote workers, and agent executors are outside this use.
# Losing the controller pauses orchestration, not external authority expiry.
type: graph
working_dir: ..
steps:
  - name: validate
    run: bin/dr-hands lifecycle validate
  - name: approve
    depends: [validate]
    run: bin/dr-hands lifecycle approve
  - name: provision
    depends: [approve]
    run: bin/dr-hands lifecycle provision
  - name: deliver
    depends: [provision]
    run: bin/dr-hands lifecycle deliver
  - name: start
    depends: [deliver]
    run: bin/dr-hands lifecycle start
  - name: observe
    depends: [start]
    run: bin/dr-hands lifecycle observe
  - name: revoke
    depends: [observe]
    run: bin/dr-hands lifecycle revoke
  - name: destroy
    depends: [revoke]
    run: bin/dr-hands lifecycle destroy
  - name: verify-removed
    depends: [destroy]
    run: bin/dr-hands lifecycle verify-removed
handler_on:
  # Best-effort failure/cancellation cleanup is not a guarantee after process or
  # workstation loss. Independent removal/reconciliation and external expiry
  # remain mandatory. Cleanup is idempotent and never waits for approval/export.
  exit:
    run: bin/dr-hands remove
